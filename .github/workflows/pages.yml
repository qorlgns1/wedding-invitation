name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_KAKAO_APP_KEY: ${{ vars.VITE_KAKAO_APP_KEY }}
          VITE_GROOM_NAME_KR: ${{ vars.VITE_GROOM_NAME_KR }}
          VITE_GROOM_NAME_EN: ${{ vars.VITE_GROOM_NAME_EN }}
          VITE_GROOM_DISPLAY_NAME: ${{ vars.VITE_GROOM_DISPLAY_NAME }}
          VITE_GROOM_BIRTH_ORDER: ${{ vars.VITE_GROOM_BIRTH_ORDER }}
          VITE_GROOM_FATHER_NAME: ${{ vars.VITE_GROOM_FATHER_NAME }}
          VITE_GROOM_MOTHER_NAME: ${{ vars.VITE_GROOM_MOTHER_NAME }}
          VITE_BRIDE_NAME_KR: ${{ vars.VITE_BRIDE_NAME_KR }}
          VITE_BRIDE_NAME_EN: ${{ vars.VITE_BRIDE_NAME_EN }}
          VITE_BRIDE_DISPLAY_NAME: ${{ vars.VITE_BRIDE_DISPLAY_NAME }}
          VITE_BRIDE_BIRTH_ORDER: ${{ vars.VITE_BRIDE_BIRTH_ORDER }}
          VITE_BRIDE_FATHER_NAME: ${{ vars.VITE_BRIDE_FATHER_NAME }}
          VITE_BRIDE_MOTHER_NAME: ${{ vars.VITE_BRIDE_MOTHER_NAME }}
          VITE_WEDDING_DATE: ${{ vars.VITE_WEDDING_DATE }}
          VITE_WEDDING_TIME: ${{ vars.VITE_WEDDING_TIME }}
          VITE_VENUE_NAME: ${{ vars.VITE_VENUE_NAME }}
          VITE_VENUE_ADDRESS: ${{ vars.VITE_VENUE_ADDRESS }}
          VITE_VENUE_FULL_ADDRESS: ${{ vars.VITE_VENUE_FULL_ADDRESS }}
          VITE_LETTER_CONTENT: ${{ vars.VITE_LETTER_CONTENT }}
          VITE_PAGE_TITLE: ${{ vars.VITE_PAGE_TITLE }}
          VITE_META_TITLE: ${{ vars.VITE_META_TITLE }}
          VITE_META_DESCRIPTION: ${{ vars.VITE_META_DESCRIPTION }}
          VITE_META_IMAGE: ${{ vars.VITE_META_IMAGE }}
          VITE_COVER_IMAGE_URL: ${{ vars.VITE_COVER_IMAGE_URL }}
          VITE_CALENDAR_IMAGE_URL: ${{ vars.VITE_CALENDAR_IMAGE_URL }}
          VITE_VENUE_MAP_IMAGE_URL: ${{ vars.VITE_VENUE_MAP_IMAGE_URL }}
          VITE_INTRO_IMAGE_URL: ${{ vars.VITE_INTRO_IMAGE_URL }}
          VITE_GALLERY_URLS: ${{ vars.VITE_GALLERY_URLS }}
          VITE_ACCOUNT_GROOM_FATHER_BANK: ${{ vars.VITE_ACCOUNT_GROOM_FATHER_BANK }}
          VITE_ACCOUNT_GROOM_FATHER_NUMBER: ${{ vars.VITE_ACCOUNT_GROOM_FATHER_NUMBER }}
          VITE_ACCOUNT_GROOM_MOTHER_BANK: ${{ vars.VITE_ACCOUNT_GROOM_MOTHER_BANK }}
          VITE_ACCOUNT_GROOM_MOTHER_NUMBER: ${{ vars.VITE_ACCOUNT_GROOM_MOTHER_NUMBER }}
          VITE_ACCOUNT_GROOM_BANK: ${{ vars.VITE_ACCOUNT_GROOM_BANK }}
          VITE_ACCOUNT_GROOM_NUMBER: ${{ vars.VITE_ACCOUNT_GROOM_NUMBER }}
          VITE_ACCOUNT_BRIDE_FATHER_BANK: ${{ vars.VITE_ACCOUNT_BRIDE_FATHER_BANK }}
          VITE_ACCOUNT_BRIDE_FATHER_NUMBER: ${{ vars.VITE_ACCOUNT_BRIDE_FATHER_NUMBER }}
          VITE_ACCOUNT_BRIDE_MOTHER_BANK: ${{ vars.VITE_ACCOUNT_BRIDE_MOTHER_BANK }}
          VITE_ACCOUNT_BRIDE_MOTHER_NUMBER: ${{ vars.VITE_ACCOUNT_BRIDE_MOTHER_NUMBER }}
          VITE_ACCOUNT_BRIDE_BANK: ${{ vars.VITE_ACCOUNT_BRIDE_BANK }}
          VITE_ACCOUNT_BRIDE_NUMBER: ${{ vars.VITE_ACCOUNT_BRIDE_NUMBER }}
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
